# [ Source/Run Extra Files ]
# Source colorscheme configuration
source-file "~/.config/tmux/colorscheme.tmux"

# Source core options
source-file "~/.config/tmux/core/*"

# Source Keymaps
source-file "~/.config/tmux/keymaps.tmux"

# [ Plugins ]
# Termux Plugin Manager itself
set -g @plugin "tmux-plugins/tpm"

# Plugin which adds custom nerd font icons to window names
set -g @plugin "joshmedeski/tmux-nerd-font-window-name"

# Tmux SessionX fuzzy finder plugin, for a lot of stuff
set -g @plugin "omerxx/tmux-sessionx"

# Initialize Tmux Plugin Manager
run-shell "~/.config/tmux/plugins/tpm/tpm"

