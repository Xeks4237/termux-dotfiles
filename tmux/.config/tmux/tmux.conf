# [ Plugins ]
# Tmux Plugin Manager's fork with async loading
set -g @plugin 'x3rAx/tpm-async'

# Plugin which adds custom nerd font icons to window names
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# Plugin which allows searcing keymaps in fuzzy finder
set -g @plugin 'lost-melody/tmux-command-palette'

# [ Source/Run Extra Files ]
# Source core options
source -F "#{d:current_file}/options.tmux"

# Source colorscheme configuration
source -F "#{d:current_file}/colorscheme.tmux"

# Source core keymaps
source -F "#{d:current_file}/keymaps.tmux"

# Initialize TPM
run -b '#{d:current_file}/plugins/tpm-async/tpm'

# Source file with configurations for plugins
source -F "#{d:current_file}/plugins.tmux"
