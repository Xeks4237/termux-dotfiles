# [ Plugins ]
# tpm-async: Tmux Plugin Manager's fork with async loading
set -g @plugin 'x3rAx/tpm-async'

# tmux-nerd-font-window-name: Plugin which adds custom nerd font icons to window names
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# Initialize Termux Plugin Manager
run -b '#{d:current_file}/plugins/tpm-async/tpm'

# [ Colorscheme ]
set -g @theme 'catppuccin_mocha'
source -qF '#{d:current_file}/colorscheme.tmux'

# [ Server Options ]
source -qF '#{d:current_file}/server.tmux'

# [ Session Options ]
source -qF '#{d:current_file}/session.tmux'

# [ Window & Pane Options ]
source -qF '#{d:current_file}/window&pane.tmux'

# [ Keymaps ]
source -qF '#{d:current_file}/keymaps.tmux'
